<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="color-scheme" content="dark">
  <title>Neoball - World's Best Silent Basketball</title>
  <meta name="description" content="The world's best silent basketball - according to the kids. Play anytime, anywhere without the noise.">

  <!-- Preconnect to external domains -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>

  <!-- Preload critical assets -->
  <link rel="preload" href="./images/court.webp" as="image">
  <link rel="preload" href="./images/neoballypwhite.png" as="image">
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" as="style">

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.164.0/build/three.module.js",
      "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
    }
  }
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0a url("./images/court.webp") center / cover no-repeat fixed;
    }

    /* Loading Screen - Cyan Fire Loader */
    .loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      pointer-events: all;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loader-top,
    .loader-bottom {
      position: absolute;
      left: 0;
      width: 100%;
      height: 50%;
      background: #0a0a0a;
      transition: transform 1s cubic-bezier(0.76, 0, 0.24, 1);
    }

    .loader-top {
      top: 0;
      transform-origin: top center;
    }

    .loader-bottom {
      bottom: 0;
      transform-origin: bottom center;
    }

    .loader-line {
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg,
        transparent 0%,
        #00f6e0 10%,
        #00ffff 50%,
        #00f6e0 90%,
        transparent 100%
      );
      transform: translateY(-50%) scaleX(0);
      transform-origin: center;
      z-index: 10000;
      border-radius: 2px;
    }

    /* Cyan fire glow layers */
    .loader-line::before,
    .loader-line::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 100%;
      transform: translateY(-50%);
      border-radius: 2px;
    }

    /* Inner intense glow */
    .loader-line::before {
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(0, 255, 255, 0.8) 20%,
        rgba(255, 255, 255, 0.9) 50%,
        rgba(0, 255, 255, 0.8) 80%,
        transparent 100%
      );
      filter: blur(4px);
      animation: fireFlicker 0.15s ease-in-out infinite alternate;
    }

    /* Outer fire bloom */
    .loader-line::after {
      height: 200%;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(0, 246, 224, 0.6) 15%,
        rgba(0, 255, 255, 0.4) 50%,
        rgba(0, 246, 224, 0.6) 85%,
        transparent 100%
      );
      filter: blur(12px);
      animation: fireGlow 0.3s ease-in-out infinite alternate;
    }

    /* Animated glow container */
    .loader-glow {
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      height: 60px;
      transform: translateY(-50%) scaleX(0);
      transform-origin: center;
      z-index: 9999;
      pointer-events: none;
      background: radial-gradient(ellipse at center,
        rgba(0, 255, 255, 0.3) 0%,
        rgba(0, 246, 224, 0.15) 30%,
        transparent 70%
      );
      filter: blur(20px);
      animation: pulseGlow 0.5s ease-in-out infinite alternate;
    }

    /* Fire particles container */
    .loader-particles {
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      height: 40px;
      transform: translateY(-50%) scaleX(0);
      transform-origin: center;
      z-index: 10001;
      pointer-events: none;
      overflow: visible;
    }

    /* Progress percentage - JetBrains Mono */
    .loader-progress {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #00f6e0;
      text-shadow: 0 0 10px #00f6e0, 0 0 20px #00f6e0, 0 0 40px #00f6e0;
      z-index: 10002;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .loader.active .loader-progress {
      opacity: 1;
    }

    @keyframes fireFlicker {
      0% { opacity: 0.8; transform: translateY(-50%) scaleY(1); }
      100% { opacity: 1; transform: translateY(-50%) scaleY(1.2); }
    }

    @keyframes fireGlow {
      0% { opacity: 0.6; transform: translateY(-50%) scaleY(0.8); }
      100% { opacity: 1; transform: translateY(-50%) scaleY(1.3); }
    }

    @keyframes pulseGlow {
      0% { opacity: 0.5; }
      100% { opacity: 0.8; }
    }

    @keyframes particleRise {
      0% {
        opacity: 0;
        transform: translateY(0) scale(0.5);
      }
      20% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translateY(-30px) scale(0);
      }
    }

    /* Progress-driven animation (controlled via JS) */
    .loader.active .loader-line,
    .loader.active .loader-glow,
    .loader.active .loader-particles {
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .loader.reveal .loader-top {
      transform: translateY(-100%);
    }

    .loader.reveal .loader-bottom {
      transform: translateY(100%);
    }

    .loader.reveal .loader-line,
    .loader.reveal .loader-glow,
    .loader.reveal .loader-particles,
    .loader.reveal .loader-progress {
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .loader.hidden {
      pointer-events: none;
      visibility: hidden;
    }

    /* ========================================
       TOP NAVIGATION - Glass Morphism
       ======================================== */
    :root {
      --top-nav-height-mobile: 56px;
      --top-nav-height: 64px;
    }

    .top-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 200;
      padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 10px;
    }

    .top-nav__glass {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: var(--top-nav-height-mobile);
      padding: 0 16px;
      background: linear-gradient(
        135deg,
        rgba(0, 255, 255, 0.08) 0%,
        rgba(0, 150, 150, 0.05) 50%,
        rgba(0, 0, 0, 0.25) 100%
      );
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-radius: 14px;
      border: 1px solid rgba(0, 255, 255, 0.15);
      box-shadow:
        0 4px 24px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    /* Left cluster */
    .top-nav__left {
      display: flex;
      align-items: center;
      gap: 24px;
      flex: 1;
    }

    /* Hamburger button */
    .top-nav__hamburger {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      background: transparent;
      border: none;
      cursor: pointer;
      color: #fff;
      padding: 0;
      margin-left: -8px;
      transition: opacity 0.2s;
    }

    .top-nav__hamburger:hover {
      opacity: 0.7;
    }

    .top-nav__hamburger svg {
      width: 20px;
      height: 14px;
    }

    /* Desktop nav links */
    .top-nav__links {
      display: none;
      align-items: center;
      gap: 28px;
    }

    .top-nav__link {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: rgba(255, 255, 255, 0.9);
      text-decoration: none;
      transition: color 0.2s, text-shadow 0.2s;
    }

    .top-nav__link:hover {
      color: #00FFFF;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
    }

    /* Center logo */
    .top-nav__center {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .top-nav__logo {
      display: block;
    }

    .top-nav__logo img {
      height: 32px;
      width: auto;
    }

    /* Right cluster */
    .top-nav__right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      flex: 1;
    }

    .top-nav__icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      background: transparent;
      border: none;
      cursor: pointer;
      color: #fff;
      padding: 0;
      transition: opacity 0.2s, color 0.2s;
      text-decoration: none;
    }

    .top-nav__icon-btn:hover {
      color: #00FFFF;
    }

    .top-nav__icon-btn svg {
      width: 20px;
      height: 20px;
    }

    .top-nav__icon-btn--search {
      display: none;
    }

    /* Cart badge */
    .top-nav__cart {
      position: relative;
    }

    .top-nav__cart-badge {
      position: absolute;
      top: 4px;
      right: 4px;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      background: #00FFFF;
      color: #0a0a0a;
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 700;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ========================================
       MOBILE MENU
       ======================================== */
    .mobile-menu {
      position: fixed;
      inset: 0;
      z-index: 300;
      pointer-events: none;
      visibility: hidden;
    }

    .mobile-menu.open {
      pointer-events: auto;
      visibility: visible;
    }

    .mobile-menu__backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .mobile-menu.open .mobile-menu__backdrop {
      opacity: 1;
    }

    .mobile-menu__panel {
      position: absolute;
      top: 0;
      left: 0;
      width: min(320px, 85vw);
      height: 100%;
      background: linear-gradient(
        180deg,
        rgba(15, 15, 15, 0.98) 0%,
        rgba(10, 10, 10, 0.99) 100%
      );
      border-right: 1px solid rgba(0, 255, 255, 0.1);
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
    }

    .mobile-menu.open .mobile-menu__panel {
      transform: translateX(0);
    }

    .mobile-menu__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 0px) + 16px) 20px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .mobile-menu__close {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      cursor: pointer;
      color: #fff;
      margin-right: -8px;
    }

    .mobile-menu__close:hover {
      color: #00FFFF;
    }

    .mobile-menu__nav {
      flex: 1;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mobile-menu__link {
      display: block;
      padding: 16px 0;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 0.04em;
      color: #fff;
      text-decoration: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      transition: color 0.2s, padding-left 0.2s;
    }

    .mobile-menu__link:hover {
      color: #00FFFF;
      padding-left: 8px;
    }

    .mobile-menu__footer {
      padding: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .mobile-menu__social {
      display: flex;
      gap: 16px;
    }

    .mobile-menu__social a {
      color: rgba(255, 255, 255, 0.5);
      transition: color 0.2s;
    }

    .mobile-menu__social a:hover {
      color: #00FFFF;
    }

    /* Desktop responsive */
    @media (min-width: 768px) {
      .top-nav {
        padding: calc(env(safe-area-inset-top, 0px) + 12px) 20px 12px;
      }

      .top-nav__glass {
        height: var(--top-nav-height);
        padding: 0 24px;
      }

      .top-nav__hamburger {
        display: none;
      }

      .top-nav__links {
        display: flex;
      }

      .top-nav__logo img {
        height: 38px;
      }

      .top-nav__icon-btn--search {
        display: flex;
      }
    }

    @media (min-width: 1024px) {
      .top-nav__glass {
        padding: 0 32px;
      }

      .top-nav__links {
        gap: 36px;
      }

      .top-nav__link {
        font-size: 13px;
      }

      .top-nav__logo img {
        height: 42px;
      }
    }

    .neoball-btn {
      position: fixed;
      bottom: 8%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 130;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #FF1493;
      color: #fff;
      border: 2px solid #FF1493;
      padding: 15px 40px;
      font-family: 'Inter', sans-serif;
      font-weight: bold;
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 20, 147, 0.5), 0 0 30px rgba(255, 20, 147, 0.3);
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      border-radius: 5px;
      text-decoration: none;
      will-change: background-color, color, border-color, box-shadow;
    }

    .neoball-btn:hover {
      background-color: #00f6e0;
      color: #0a0a0a;
      border-color: #00f6e0;
      box-shadow: 0 0 20px rgba(0, 246, 224, 0.6), 0 0 40px rgba(0, 246, 224, 0.3);
    }

    @media (max-width: 767px) {
      .neoball-btn {
        padding: 12px 30px;
        font-size: 14px;
        bottom: 5%;
      }

      .neoball-logo-link {
        top: calc(env(safe-area-inset-top, 0px) + 12px);
      }

      .neoball-logo-img {
        height: clamp(32px, 5vw, 45px);
      }
    }

    /* Hero Quote (MOBILE-FIRST) */
    .hero-quote {
      position: fixed;
      left: 50%;
      top: 39%;
      transform: translate(-50%, -50%);
      z-index: 85;
      width: min(92vw, 540px);
      text-align: center;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      pointer-events: auto;
    }

    .hero-quote__scrim {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(92vw, 560px);
      height: 180px;
      border-radius: 999px;
      background: radial-gradient(ellipse at center,
        rgba(0,0,0,0.78) 0%,
        rgba(0,0,0,0.52) 45%,
        rgba(0,0,0,0.00) 74%);
      filter: blur(3px);
      opacity: 0.96;
      z-index: 0;
      pointer-events: none;
    }

    .hero-quote__line {
      position: relative;
      z-index: 1;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(36px, 9vw, 64px);
      line-height: 1;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: #F5FAFF;
      text-shadow:
        0 18px 48px rgba(0,0,0,0.78),
        0 0 8px rgba(0,255,255,0.10),
        0 0 24px rgba(0,255,255,0.07);
    }

    /* Bottom line: tighter tracking for dense/premium feel */
    .hero-quote__line--bottom {
      letter-spacing: 0.045em;
    }

    .hero-quote__attribution {
      margin-top: 14px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: clamp(11px, 3vw, 13px);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(245,250,255,0.78);
      text-shadow: 0 8px 22px rgba(0,0,0,0.65);
    }

    .hero-quote__attribution::before {
      content: "";
      width: 22px;
      height: 2px;
      border-radius: 999px;
      background: rgba(0,255,255,0.55);
      box-shadow: 0 0 10px rgba(0,255,255,0.25);
    }

    @media (prefers-reduced-motion: no-preference) {
      .hero-quote {
        animation: heroIn 780ms cubic-bezier(.2,.8,.2,1) both;
        animation-delay: 0.3s;
      }
      @keyframes heroIn {
        from { opacity: 0; transform: translate(-50%,-48%) scale(0.98); }
        to { opacity: 1; transform: translate(-50%,-50%) scale(1); }
      }

      .hero-quote__line {
        animation:
          glowBreath 4.8s ease-in-out infinite alternate,
          textSettle 600ms cubic-bezier(.2,.8,.2,1) 1s both;
      }
      @keyframes glowBreath {
        from {
          text-shadow:
            0 16px 46px rgba(0,0,0,0.72),
            0 0 10px rgba(0,255,255,0.12),
            0 0 34px rgba(0,255,255,0.08);
        }
        to {
          text-shadow:
            0 16px 46px rgba(0,0,0,0.72),
            0 0 10px rgba(0,255,255,0.20),
            0 0 34px rgba(0,255,255,0.14);
        }
      }
      @keyframes textSettle {
        from { transform: translateY(-2px); }
        to { transform: translateY(0); }
      }
    }

    @media (min-width: 768px) {
      .hero-quote {
        top: 44%;
        width: min(92vw, 980px);
      }
      .hero-quote__scrim {
        height: 260px;
        width: min(92vw, 980px);
      }
      .hero-quote__line {
        font-size: clamp(56px, 7vw, 90px);
      }
    }

    /* DESKTOP HERO OVERRIDES */
    @media (min-width: 1024px) {
      .neoball-logo-link {
        top: 28px;
      }
      .neoball-logo-img {
        height: 58px;
        filter: drop-shadow(0 12px 28px rgba(0,0,0,0.55));
      }

      .hero-quote {
        top: 43%;
        width: min(980px, 78vw);
      }

      .hero-quote__scrim {
        width: min(1100px, 82vw);
        height: 240px;
        opacity: 0.92;
      }

      .hero-quote__line {
        font-size: 92px;
        letter-spacing: 0.04em;
        text-shadow:
          0 18px 54px rgba(0,0,0,0.78),
          0 0 8px rgba(0,255,255,0.10),
          0 0 22px rgba(0,255,255,0.07);
      }

      .hero-quote__line--bottom {
        letter-spacing: 0.045em;
      }

      .hero-quote__attribution {
        font-size: 12px;
        letter-spacing: 0.18em;
        color: rgba(245,250,255,0.76);
      }

      .neoball-btn {
        bottom: 7%;
        padding: 16px 44px;
        font-size: 16px;
        letter-spacing: 0.18em;
      }
    }

    /* NO-MOTION FALLBACK */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }

      .hero-quote__line {
        text-shadow:
          0 18px 54px rgba(0,0,0,0.80),
          0 0 8px rgba(0,255,255,0.08),
          0 0 18px rgba(0,255,255,0.06);
      }

      .loader {
        display: none !important;
      }
    }

    /* Cookie Consent Banner */
    .cookie-banner {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10001;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 20px;
      background: #f5f5f5;
      border-top: 1px solid #ddd;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      transform: translateY(0);
      transition: transform 0.3s ease-out, opacity 0.3s ease-out;
    }

    .cookie-banner.hidden {
      transform: translateY(100%);
      opacity: 0;
      pointer-events: none;
    }

    .cookie-banner__text {
      flex: 1;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #1a1a1a;
      line-height: 1.4;
    }

    .cookie-banner__actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .cookie-banner__btn {
      padding: 10px 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .cookie-banner__btn--accept {
      background: #00FFFF;
      color: #0a0a0a;
    }

    .cookie-banner__btn--accept:hover {
      background: #00e5e5;
      box-shadow: 0 0 12px rgba(0, 255, 255, 0.5);
    }

    .cookie-banner__btn--reject {
      background: #e0e0e0;
      color: #333;
    }

    .cookie-banner__btn--reject:hover {
      background: #d0d0d0;
    }

    .cookie-banner__close {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid #ccc;

  <script>
    // Fire Loader System
    const loader = document.getElementById('loader');
    const loaderLine = document.getElementById('loader-line');
    const loaderGlow = document.getElementById('loader-glow');
    const loaderParticles = document.getElementById('loader-particles');
    const loaderProgress = document.getElementById('loader-progress');

    // Loading progress state
    let loadProgress = 0;
    let targetProgress = 0;
    let particleAnimationId = null;

    // Start loader immediately
    requestAnimationFrame(() => {
      loader.classList.add('active');
      startParticleSystem();
      animateProgress();
    });

    // Smooth progress animation (eases toward target)
    function animateProgress() {
      const ease = 0.08;
      loadProgress += (targetProgress - loadProgress) * ease;

      // Clamp and apply
      const progress = Math.min(Math.max(loadProgress, 0), 1);
      const scaleValue = `translateY(-50%) scaleX(${progress})`;

      loaderLine.style.transform = scaleValue;
      loaderGlow.style.transform = scaleValue;
      loaderParticles.style.transform = scaleValue;

      // Update percentage display
      loaderProgress.textContent = `${Math.round(progress * 100)}%`;

      // Continue animating until fully loaded and revealed
      if (!loader.classList.contains('hidden')) {
        requestAnimationFrame(animateProgress);
      }
    }

    // Update progress (called from balls overlay)
    function setLoadProgress(value) {
      targetProgress = Math.min(Math.max(value, targetProgress), 1); // Only increase
    }

    // Expose globally for balls-overlay.js
    window.setLoadProgress = setLoadProgress;

    // Fire particle system
    function startParticleSystem() {
      const colors = ['#00f6e0', '#00ffff', '#40fff0', '#80ffff', '#ffffff'];

      function createParticle() {
        if (loader.classList.contains('reveal')) return;

        const particle = document.createElement('div');
        const size = 2 + Math.random() * 4;
        const xPos = Math.random() * 100;
        const duration = 0.4 + Math.random() * 0.6;
        const delay = Math.random() * 0.1;

        particle.style.cssText = `
          position: absolute;
          left: ${xPos}%;
          top: 50%;
          width: ${size}px;
          height: ${size}px;
          background: ${colors[Math.floor(Math.random() * colors.length)]};
          border-radius: 50%;
          pointer-events: none;
          opacity: 0;
          box-shadow: 0 0 ${size * 2}px currentColor, 0 0 ${size * 4}px currentColor;
          animation: particleRise ${duration}s ease-out ${delay}s forwards;
        `;

        loaderParticles.appendChild(particle);

        // Remove after animation
        setTimeout(() => {
          particle.remove();
        }, (duration + delay) * 1000 + 100);
      }

      // Spawn particles based on progress
      function spawnParticles() {
        if (loader.classList.contains('reveal')) return;

        // More particles as progress increases
        const intensity = Math.max(1, Math.floor(loadProgress * 4));
        for (let i = 0; i < intensity; i++) {
          if (Math.random() < 0.6) createParticle();
        }

        particleAnimationId = setTimeout(spawnParticles, 80);
      }

      spawnParticles();
    }

    // Reveal function - cinematic
    function revealSite() {
      // Ensure we reach 100%
      targetProgress = 1;

      // Wait for progress animation to catch up
      const waitForComplete = () => {
        if (loadProgress >= 0.95) {
          // Clear particle spawner
          if (particleAnimationId) clearTimeout(particleAnimationId);

          setTimeout(() => {
            loader.classList.add('reveal');

            setTimeout(() => {
              loader.classList.add('hidden');
              // Clean up remaining particles
              loaderParticles.innerHTML = '';
            }, 1200);
          }, 300);
        } else {
          requestAnimationFrame(waitForComplete);
        }
      };

      waitForComplete();
    }
  </script>

  <!-- Mobile Menu Script -->
  <script>
    (function initMobileMenu() {
      const mobileMenu = document.getElementById('mobileMenu');
      const menuToggle = document.getElementById('menuToggle');
      const menuClose = document.getElementById('menuClose');
      const menuBackdrop = document.getElementById('menuBackdrop');
      const menuLinks = mobileMenu.querySelectorAll('.mobile-menu__link');

      function openMenu() {
        mobileMenu.classList.add('open');
        document.body.style.overflow = 'hidden';
      }

      function closeMenu() {
        mobileMenu.classList.remove('open');
        document.body.style.overflow = '';
      }

      menuToggle?.addEventListener('click', openMenu);
      menuClose?.addEventListener('click', closeMenu);
      menuBackdrop?.addEventListener('click', closeMenu);

      // Close on link click
      menuLinks.forEach(link => {
        link.addEventListener('click', closeMenu);
      });

      // Close on ESC key
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && mobileMenu.classList.contains('open')) {
          closeMenu();
        }
      });
    })();
  </script>

  <script type="module">
    import { initBallsOnPage } from './js/balls-overlay.js';

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (reduceMotion) {
      // Skip loader for reduced motion
      document.getElementById('loader').classList.add('hidden');
    } else {
      // Track which layers have completed loading
      let layersLoaded = 0;
      const totalLayers = 2;

      // Progress callback - aggregates from both layers
      const onProgress = (value) => {
        // Report to global loader (takes max progress from either layer)
        if (typeof window.setLoadProgress === 'function') {
          window.setLoadProgress(value);
        }
      };

      const onLayerComplete = () => {
        layersLoaded++;
        if (layersLoaded >= totalLayers) {
          // Both layers ready - reveal!
          revealSite();
        }
      };

      // BACK LAYER (ambient)
      const backLayer = initBallsOnPage({
        container: document.getElementById('ballsBack'),
        zIndex: 1,
        zOffset: -0.8,
        ballCount: 8,
        ballRadius: 1.0,
        onProgress: onProgress
      });

      // FRONT LAYER (depth accents)
      const frontLayer = initBallsOnPage({
        container: document.getElementById('ballsFront'),
        zIndex: 1,
        zOffset: 0.8,
        ballCount: window.innerWidth < 768 ? 3 : 4,
        ballRadius: 1.0,
        onProgress: onProgress
      });

      // Check periodically if balls are initialized (they call _reportProgress(1.0) when done)
      const checkReady = setInterval(() => {
        const balls = window.neoballBalls || [];
        if (balls.length >= 2) {
          clearInterval(checkReady);
          revealSite();
        }
      }, 100);

      // Fallback timeout
      setTimeout(() => {
        clearInterval(checkReady);
        revealSite();
      }, 8000);
    }
  </script>

  <!-- Cookie Consent Logic -->
  <script>
    (function initCookieBanner() {
      const banner = document.getElementById('cookieBanner');
      const acceptBtn = document.getElementById('cookieAccept');
      const rejectBtn = document.getElementById('cookieReject');
      const closeBtn = document.getElementById('cookieClose');

      if (!banner) return;

      const STORAGE_KEY = 'neoball_cookie_consent';

      // Check if user already made a choice
      const consent = localStorage.getItem(STORAGE_KEY);
      if (consent) {
        banner.classList.add('hidden');
        return;
      }

      // Show banner after loader reveals
      setTimeout(() => {
        banner.classList.remove('hidden');
      }, 3000);

      function hideBanner(choice) {
        localStorage.setItem(STORAGE_KEY, choice);
        banner.classList.add('hidden');
      }

      acceptBtn?.addEventListener('click', () => hideBanner('accepted'));
      rejectBtn?.addEventListener('click', () => hideBanner('rejected'));
      closeBtn?.addEventListener('click', () => hideBanner('dismissed'));
    })();
  </script>
